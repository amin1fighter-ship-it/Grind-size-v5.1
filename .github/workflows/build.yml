name: Build Coffee Grind Analyzer APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract and Locate Gradle Files
      run: |
        unzip -o *.zip
        # پیدا کردن دقیق پوشه اصلی پروژه بر اساس فایل settings
        TARGET_DIR=$(dirname "$(find . -name "settings.gradle.kts" | head -n 1)")
        if [ -n "$TARGET_DIR" ] && [ "$TARGET_DIR" != "." ]; then
          echo "Found project root in $TARGET_DIR, moving to workspace root..."
          shopt -s dotglob
          cp -a "$TARGET_DIR"/. .
          rm -rf "$TARGET_DIR"
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Wrapper
      run: gradle wrapper --gradle-version 8.9

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CoffeeGrindAnalyzer-debug
        path: app/build/outputs/apk/debug/app-debug.apk
